services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: knowledge_agent
      POSTGRES_PASSWORD: knowledge_agent
      POSTGRES_DB: knowledge_agent
    ports:
      - "7432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
